name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: jemco }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jemco
      SESSION_SECRET: ci
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jemco/shared build
      - run: pnpm --filter @jemco/api db:generate
      - run: pnpm --filter @jemco/api db:migrate
      - run: pnpm --filter @jemco/api db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: API end-to-end (fresh database, mock identity provider)
        run: pnpm --filter @jemco/api test:e2e
        env: { TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jemco_test }
      - name: Browser journey (Playwright, phone and desktop)
        run: |
          pnpm --filter @jemco/api db:seed
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm exec next start -p 3000 > /tmp/web.log 2>&1 &)
          pnpm --filter @jemco/web exec playwright install --with-deps chromium
          for i in $(seq 1 30); do curl -sf localhost:4000/v1/health && break; sleep 1; done
          pnpm --filter @jemco/web test:e2e
        env: { WEB_ORIGIN: http://localhost:3000, API_PORT: "4000" }
