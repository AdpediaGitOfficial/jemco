# JEMCO NCR — single-server deployment (option B in the technology plan).
# Usage:  cp .env.example .env && edit, then  docker compose up -d
# Caddy terminates TLS for DOMAIN and routes /api/* to the API and everything else to the web app.
name: jemco-ncr
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jemco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-jemco}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jemco} -d ${DB_NAME:-jemco}"], interval: 10s, timeout: 5s, retries: 10 }

  api:
    image: ${API_IMAGE:-ghcr.io/adpediagitofficial/jemco-api:latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${DB_USER:-jemco}:${DB_PASSWORD}@db:5432/${DB_NAME:-jemco}
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      UPLOAD_DIR: /app/uploads
      CHROMIUM_PATH: /usr/bin/chromium
      MAIL_FROM: ${MAIL_FROM:-JEMCO NCR <ncr@example.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/sso/callback
      OIDC_LABEL: ${OIDC_LABEL:-Google}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    volumes: ["uploads:/app/uploads"]
    expose: ["4000"]

  web:
    image: ${WEB_IMAGE:-ghcr.io/adpediagitofficial/jemco-web:latest}
    build: { context: .., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api/v1" } }
    restart: unless-stopped
    depends_on: [api]
    expose: ["3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [web, api]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-jemco}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-jemco}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-35}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    volumes: ["backups:/backups", "./backup.sh:/backup.sh:ro"]
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
